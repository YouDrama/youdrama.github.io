<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111014">
    <meta name="detail-endpoint" content="https://drama2-api.thinkyeah.com/api/drama/detail">
    <meta name="preview-mode" content="false">
    <title>You Drama · Short dramas</title>
    <link rel="icon" type="image/png" href="./assets/youdrama.png">
    <style>:root {
  color-scheme: dark;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #000;
  color: #fff;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --brand-gradient: none;
  --brand-text: inherit;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 280px;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-width: 280px;
  height: 100dvh;
  min-height: 0;
  margin: 0;
  overflow: hidden;
  background: #000;
  color: #fff;
}

button {
  font: inherit;
}

.backdrop,
.backdrop-shade {
  position: fixed;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.backdrop {
  object-fit: cover;
  filter: blur(28px);
  transform: scale(1.1);
}

.backdrop-shade {
  z-index: -1;
  background: linear-gradient(180deg, rgb(2 2 2 / 36%), rgb(2 2 2 / 81%));
}

.page-shell {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  width: min(100%, 480px);
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  color: #fff;
}

.topbar {
  position: relative;
  flex-shrink: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 60px;
  padding: 12px 20px;
  background: rgb(255 255 255 / 16%);
  backdrop-filter: blur(18px);
}

.app-logo {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border: 1px solid rgb(255 255 255 / 12%);
  border-radius: 8px;
  object-fit: cover;
}

.app-name {
  min-width: 0;
  flex: 1 1 auto;
  overflow: hidden;
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  line-height: 20px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.open-button {
  flex: 0 0 65px;
  width: 65px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 32px;
  background: var(--brand-gradient);
  color: var(--brand-text);
  font-size: 14px;
  font-weight: 500;
  line-height: 1;
  cursor: pointer;
}

.open-button:disabled,
.continue-button:disabled {
  opacity: 1;
  cursor: not-allowed;
}

.poster-stage {
  position: relative;
  flex: 0 1 auto;
  min-height: 0;
  width: min(calc(100% - 96px), 320px);
  aspect-ratio: 5 / 7;
  max-height: 54dvh;
  margin: 20px auto 16px;
}

.drama-cover,
.cover-placeholder {
  position: absolute;
  top: 0;
  left: 50%;
  width: auto;
  max-width: 100%;
  height: 100%;
  aspect-ratio: 5 / 7;
  transform: translateX(-50%);
  overflow: hidden;
  border: 1px solid rgb(255 255 255 / 12%);
  border-radius: 8px;
}

.drama-cover {
  z-index: 1;
  object-fit: cover;
  background: rgb(255 255 255 / 5%);
}

.cover-placeholder {
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, rgb(255 255 255 / 12%), rgb(14 11 14 / 82%));
  color: rgb(255 255 255 / 76%);
  font-size: 13px;
  text-align: center;
}

.cover-placeholder[hidden],
.drama-cover[hidden],
.app-logo[hidden],
.retry-button[hidden],
.preview-marker[hidden],
.backdrop[hidden] {
  display: none;
}

.cover-action {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  display: grid;
  width: 72px;
  height: 72px;
  padding: 0;
  place-items: center;
  overflow: visible;
  border: 0;
  border-radius: 50%;
  background: rgb(0 0 0 / 50%);
  backdrop-filter: blur(5px);
  box-shadow: 0 2px 4px rgb(0 0 0 / 25%);
  transform: translate(-50%, -50%);
  cursor: pointer;
}

.cover-action svg {
  display: block;
  max-width: none;
}

.drama-info {
  display: flex;
  flex-direction: column;
  flex: 1 0 auto;
  min-height: 0;
  margin: 0 20px;
  min-width: 0;
}

.drama-info h1 {
  flex-shrink: 0;
  margin: 0;
  color: #fff;
  font-size: 20px;
  font-weight: 600;
  line-height: 24px;
  overflow-wrap: anywhere;
}

.drama-tags {
  flex-shrink: 0;
  display: flex;
  min-height: 0;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 5px;
}

.drama-tags:empty {
  display: none;
}

.drama-tag {
  display: inline-flex;
  min-height: 17px;
  align-items: center;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgb(255 255 255 / 12%);
  color: rgb(255 255 255 / 85%);
  font-size: 11px;
  font-weight: 400;
  line-height: 13px;
}

.drama-description {
  flex: 1 1 auto;
  height: 0;
  min-height: 40px;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  scrollbar-width: none;
  margin: 8px 0 0;
  color: rgb(255 255 255 / 60%);
  font-size: 14px;
  line-height: 20px;
  overflow-wrap: anywhere;
}

.drama-description::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

.drama-description[data-more-below="true"] {
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%);
}

.action-dock {
  position: relative;
  flex-shrink: 0;
  margin: 16px 20px calc(32px + env(safe-area-inset-bottom));
  height: 52px;
}

.status-message {
  position: absolute;
  top: 61px;
  right: 20px;
  left: 20px;
  min-height: 16px;
  margin: 0;
  color: rgb(255 255 255 / 76%);
  font-size: 10px;
  line-height: 13px;
  text-align: left;
}

.continue-button {
  display: flex;
  width: 100%;
  height: 52px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 20px;
  border: 0;
  border-radius: 40px;
  background: var(--brand-gradient);
  color: var(--brand-text);
  font-size: 18px;
  font-weight: 500;
  line-height: 24px;
  white-space: nowrap;
  cursor: pointer;
}

.continue-button img {
  flex: 0 0 18px;
}

.hand-animation {
  position: absolute;
  z-index: 2;
  top: 7px;
  right: 0;
  width: 70px;
  height: 70px;
  overflow: visible;
  pointer-events: none;
}

.hand-animation svg {
  display: block;
  width: 100%;
  height: 100%;
}

.preview-marker {
  position: absolute;
  top: 75px;
  right: 20px;
  z-index: 3;
  margin: 0;
  color: #fff;
  font-size: 10px;
  line-height: 12px;
  text-align: right;
}

.retry-button {
  position: absolute;
  top: 60px;
  right: 20px;
  z-index: 3;
  padding: 2px 6px;
  border: 1px solid rgb(255 255 255 / 35%);
  border-radius: 12px;
  background: rgb(17 16 20 / 82%);
  color: #fff;
  font-size: 12px;
  cursor: pointer;
}

body[data-state="error"] .status-message {
  right: 82px;
}

button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

@media (max-width: 320px) {
  .topbar {
    gap: 8px;
    padding-right: 16px;
    padding-left: 16px;
  }

  .drama-info { margin-inline: 16px; }

  .action-dock { margin-inline: 16px; }

  .continue-button { padding-left: 12px; padding-right: 40px; }
  .hand-animation { width: 60px; height: 60px; top: 12px; right: -6px; }

  .status-message {
    right: 16px;
    left: 16px;
    font-size: 9px;
  }

  .retry-button { right: 16px; }
  .preview-marker { right: 16px; }
}

.play-icon{width:18px;height:18px;flex:0 0 18px;background:var(--brand-text);mask:url('./assets/cta-play.svg') center/contain no-repeat;-webkit-mask:url('./assets/cta-play.svg') center/contain no-repeat}
.hand-fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.hand-animation:has(svg) .hand-fallback{display:none}
.loading-skeleton{display:none;flex:1 0 100px;min-height:0;overflow:hidden;margin:0 20px}
.skeleton-title,.skeleton-tags i,.skeleton-line{background:rgb(255 255 255 / 12%);border-radius:4px}
.skeleton-title{height:23px}.skeleton-tags{display:flex;gap:6px;margin-top:6px;height:17px}.skeleton-tags i{display:block;width:64px;height:17px}
.skeleton-line{height:17px;margin-top:12px}.skeleton-line.short{width:134px}
body[data-state="loading"] .loading-skeleton{display:block}body[data-state="loading"] .drama-info{display:none}
body[data-state="loading"] .status-message{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
body[data-state="loading"] .cover-placeholder{background:#141414}body[data-state="loading"] .cover-placeholder span{visibility:hidden}
body[data-state="loading"] .cover-placeholder::after{content:'';position:absolute;inset:-15% -50%;background:linear-gradient(110deg,transparent 32%,rgb(255 255 255 / 8%) 50%,transparent 68%);animation:shimmer 1.8s linear infinite}
@keyframes shimmer{from{transform:translateX(-50%)}to{transform:translateX(50%)}}
@media(prefers-reduced-motion:reduce){body[data-state="loading"] .cover-placeholder::after{animation:none}}
</style>
    <script defer src="./vendor/lottie.min.js"></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body data-state="loading" style="--brand-gradient:linear-gradient(131.889807deg, #FF5F10 0%, #FF821D 64.90201354026794%, #FF9513 100%);--brand-text:#FFFFFF">
    <img class="backdrop" data-testid="backdrop" alt="" aria-hidden="true" hidden>
    <div class="backdrop-shade" aria-hidden="true"></div>
    <main class="page-shell" aria-label="Short drama details">
      <header class="topbar">
        <img class="app-logo" data-testid="app-logo" src="./assets/youdrama.png" alt="You Drama logo">
        <span class="app-name" data-testid="app-name">You Drama</span>
        <button class="open-button" data-action="open" type="button" disabled>Open</button>
      </header>
      <p class="status-message" role="status" aria-live="polite"></p>
      <p class="preview-marker" data-testid="preview-marker" hidden>Local preview · sample data</p>
      <button class="retry-button" data-action="retry" type="button" hidden>Retry</button>

      <section class="poster-stage" aria-label="Drama cover">
        <img class="drama-cover" data-testid="drama-cover" alt="" hidden>
        <div class="cover-placeholder" data-testid="cover-placeholder" role="img" aria-label="Cover unavailable">
          <span>Loading cover…</span>
        </div>
        <button class="cover-action" data-action="cover" type="button" aria-label="Open this drama" disabled>
          <svg width="28" height="28" viewBox="30 28 28 28" aria-hidden="true"><path d="M54.4059 38.1351C57.3811 39.8528 57.3811 44.1472 54.4059 45.8649L40.7943 53.7235C37.8191 55.4413 34.1001 53.2941 34.1001 49.8586L34.1001 34.1413C34.1001 30.7059 37.8191 28.5587 40.7943 30.2764L54.4059 38.1351Z" fill="white"/></svg>
        </button>
      </section>

      <section class="loading-skeleton" data-testid="loading-skeleton" aria-label="Loading drama details" aria-busy="true">
        <div class="skeleton-title"></div><div class="skeleton-tags"><i></i><i></i></div>
        <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div>
      </section>
      <section class="drama-info" aria-live="polite">
        <h1 data-testid="drama-title"></h1>
        <div class="drama-tags" data-testid="drama-tags"></div>
        <p class="drama-description" data-testid="drama-description" tabindex="0" aria-label="Drama synopsis"></p>
      </section>

      <footer class="action-dock">
        <button class="continue-button" data-action="continue" type="button" disabled>
          <i class="play-icon" aria-hidden="true"></i>
          <span>Continue Watching</span>
        </button>
        <div class="hand-animation" data-testid="hand" aria-hidden="true"><img class="hand-fallback" src="./lottie/finger.png" alt=""></div>
      </footer>
    </main>
  </body>
</html>
